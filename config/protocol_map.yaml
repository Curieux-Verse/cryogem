# base_asset -> DefiLlama protocol slug.
#
# EXPLICIT ONLY. Never guess a mapping: attaching another protocol's revenue to
# an asset is worse than having no revenue data, because a wrong number scores
# highly while a missing one honestly scores None and has its weight
# redistributed.
#
# To add a mapping: find the slug in https://api.llama.fi/protocols and confirm
# that entry's `symbol` field matches the ticker before adding it here.
# Verify each of these on the first live run; unverified rows are a guess.

