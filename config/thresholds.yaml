# ==============================================================================
# EVERY numeric threshold in this system lives in this file.
# Rule (IMPLEMENTATION_SPEC §0.1.4): never hardcode a number in a module.
# Each value is either SOURCED (citation given) or marked TUNE_ME.
# Changing a value here is a research decision — record it in docs/DECISIONS.md.
# ==============================================================================

layer1:
  # SOURCED: published funding-arb risk screener (warn 0.5 / danger 1.0)
  oi_to_mcap_fail: 1.0
  oi_to_mcap_warn: 0.5

  # SOURCED: same screener (warn 15x / danger 40x)
  perp_to_spot_vol_fail: 40.0
  perp_to_spot_vol_warn: 15.0

  # SOURCED: same screener
  min_mcap_usd: 30000000
  min_contract_age_days: 60

  # SOURCED: RAVE (9 wallets ~95% of 1B supply; 3 team wallets 89.74%),
  #          TRB (~20 whales ~95% of a 2.75M float).
  # TUNE_ME: 0.60 chosen to catch both cases with margin.
  top10_holder_share_fail: 0.60

  # TUNE_ME: low-float / high-FDV trap literature.
  min_circulating_ratio: 0.30

  # SOURCED: Keyrock, 16,000+ unlock events across 40 tokens — ~90% followed by
  # negative price pressure; team unlocks worst (to -25%); the decline typically
  # BEGINS ~30 days before the date. Hence a 30-day lookahead, not 7.
  unlock_lookahead_days: 30
  unlock_pct_circulating_fail: 0.05
  unlock_fail_recipient_types: ["team", "investor"]

  # SOURCED: RAVE — ~$6B of market cap destroyed on ~$52M of liquidations.
  # NOTE: liquidation feeds are throttled at source (one print/sec/symbol), so
  # this ratio is a LOWER BOUND. A FAIL is high-confidence; a PASS is not.
  mcap_to_liquidation_ratio_fail: 50.0
  mcap_to_liq_trigger_move_pct: 1.0   # only evaluate on 24h moves > 100%

  orphan_perp_fails: true             # no spot pair => auto-FAIL
  require_mcap_data: true             # not in CoinGecko top ~2000 => auto-FAIL

  # See DECISIONS.md D-007. Distinguishes an asset-level data gap (which FAILS
  # that asset, per spec) from a source-level outage (which disables the check
  # for the run and says so loudly). If fewer than this share of the universe
  # has usable input for a check, the check is dark rather than failing
  # everything -- disqualifying the whole market for OUR outage is not a
  # judgement about the market.
  # TUNE_ME.
  min_source_coverage: 0.20

  # D-042, the user's call: holder data must be as fresh as the prices it is
  # screened beside. collect-supply re-reads every measurable token on every
  # run, daily. A reading from today or yesterday is a measurement; anything
  # older is not. A missed run turns the check dark the next day (coverage
  # floor, D-007) -- loudly -- rather than screening on stale holders.
  holder_snapshot_max_age_days: 1

# Weights sum to 110 DELIBERATELY — normalise to 100 after computing.
# If a block is unavailable for an asset, renormalise over the remaining blocks.
# D-077: sum 110, normalised over the blocks LIVE in the run (D-075). Momentum
# (7-day flow and trend) and drawdown (reversal) deliberately pull in opposite
# directions; the literature supports both at different horizons, and the
# block-correlation report and the journal settle it with data.
layer2_weights:
  fundamental: 30
  supply: 20
  momentum: 20
  sector: 10
  events: 10
  attention: 10
  drawdown: 10

layer2:
  # SOURCED: sentiment's predictive power concentrates at extremes, not the
  # middle of the distribution. Attention contributes only when |z| exceeds this.
  attention_zscore_gate: 2.0
  attention_zscore_window_days: 30
  # TUNE_ME: bonus percentile points for the inverse signal almost nobody screens.
  unlock_overhang_cleared_bonus: 25.0
  # TUNE_ME: any block-score pair above this |rho| is measuring one thing twice.
  redundancy_corr_threshold: 0.8
  redundancy_min_days: 30
  # D-072: net issuance = circulating-supply growth over this many days,
  # annualised, from CoinGecko's own supply history. 90 days spans a quarter of
  # monthly cliffs without being dominated by one of them.
  supply_growth_window_days: 90
  # Each end of the window is the MEDIAN of this many daily readings: CoinGecko
  # revises a supply figure and reverts it a day later often enough that a
  # single-day endpoint reads noise as issuance (CAKE, 2026-02-11: +17.8%, then
  # -15.1% the next day).
  supply_smoothing_days: 7
  # TUNE_ME: annualised growth has to move by more than this (absolute, 0.02 =
  # 2 percentage points) between consecutive windows to read as falling or
  # rising rather than flat.
  emissions_trajectory_tolerance: 0.02
  # D-075: MISSING DATA SCORES NOTHING. A block measured for at least this many
  # survivors is live: every asset carries its weight, and an asset without a
  # reading earns 0 for it. A block below this is dark for everyone (attention
  # while LunarCrush is unpaid) and drops out for everyone, so no asset gains
  # on another from it. The same rule applies to the metrics inside a block.
  live_min_assets: 5
  # D-076: bump with a D-number whenever the method changes.
  score_version: "gem-v2"

layer3:
  funding_negative_extreme_pctile: 5.0
  oi_change_extreme_pctile: 95.0
  min_depth_2pct_usd: 50000          # TUNE_ME — below this, no position is exitable
  trendline_min_touches: 3
  trendline_tolerance_pct: 0.02      # TUNE_ME — how close a high must sit to the line
  swing_window_bars: 3               # bars each side for a swing-high pivot
  max_bars_since_break: 8            # TUNE_ME — a break older than this is history,
                                     # not a setup. At 1W bars that is ~2 months.
                                     # Observed 2026-09-09: without this bound, MINA
                                     # (27 weeks) and IOST (30 weeks) were reported
                                     # as live with invalidation levels from March.

collectors:
  derivatives_interval_minutes: 5
  market_interval_hours: 24
  fundamentals_interval_hours: 24
  events_interval_hours: 12
  attention_interval_hours: 6
  news_interval_minutes: 15
  # Freshness assertion: refuse to screen on stale data (§15.4.1).
  max_data_age_hours: 26
  consecutive_failures_before_alert: 3

journal:
  horizons: ["1d", "7d", "30d", "90d"]
  top_n_to_journal: 25               # journal more than you report, for statistics
  report_top_n: 15

backtest:
  taker_fee_bps: 5.0                 # 0.05% — Binance futures taker, no VIP tier
  slippage_model: "depth"            # size slippage against RECORDED depth, never printed price
  regime_btc_up_pct: 0.05            # 30d BTC return above this = "up" regime
  regime_btc_down_pct: -0.05
  holdout_fraction: 0.3333           # develop on first 2/3, test ONCE on final 1/3

# ------------------------------------------------------------------------------
# PULSE -- the hourly clock (docs/PLAN_ACTIVE_SCREENER.md; D-074, D-079..D-081).
# Computed over Layer 1 survivors only; it never overrides the kill switch.
# Every value here is locked when it ships: a change is a D-number and a new
# score_version, never an edit in place.
# ------------------------------------------------------------------------------
pulse:
  score_version: "pulse-v1"
  weights:
    flow: 25          # F1 taker flow 24H (+4H): strongest evidence (order flow)
    structure_4h: 20  # F5 4H EMA stack + trendline breaks
    momentum: 20      # F3 vol-adjusted momentum 24H/7D (trend factor)
    thrust: 15        # F2 up-volume thrust 4H (+1H): the volume spike
    oi_confirm: 10    # F4 OI x price x flow quadrant: a CONDITIONER only (D-074)
    structure_1h: 10  # F6 1H structure: confirmation
  flow_4h_relative_weight: 0.5
  thrust_baseline_bars: 30
  zscore_lookback_days: 20
  structure:
    ema_fast: 20
    ema_slow: 50
    swing_window_bars: 3
    trendline_min_touches: 3
    trendline_tolerance_pct: 0.01     # TUNE_ME
    lookback_bars: 120                # 20 days of 4H bars; 5 days of 1H bars
    max_bars_since_break: 6           # TUNE_ME: older breaks are trend, not event
  oi_flat_change: 0.01                # TUNE_ME: |OI change| under 1% is flat
  extreme_own_pctile: 95.0
  crowding_multiplier: 0.7            # R1: funding AND OI both extreme
  leverage_no_move_multiplier: 0.8    # R2: OI extreme with no price move (TRB)
  no_move_sigma: 1.0
  min_quote_volume_24h_usd: 5000000   # TUNE_ME R3: thinner books excluded
  min_bars_1h: 168                    # a week of closed bars before scoring
  live_min_assets: 5
  aligned_gem_rank_max: 25
  aligned_min_score: 70.0
  aligned_states: ["bull_break", "bull_trend"]
  journal_top_n: 10
  journal_horizons_hours: [4, 24, 72]
  alert_max_per_day: 10
  alert_bear_break_gem_top: 15
