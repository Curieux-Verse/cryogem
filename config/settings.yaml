# Non-secret configuration. Secrets live in .env / GitHub Actions secrets only.

project:
  name: gem-screener
  # Public URL of the dashboard. Used only for report links.
  site_url: "https://curieux-verse.github.io/cryogem/"            # e.g. https://<user>.github.io/gem-screener/

database:
  local_path: "data/gem.db"
  # If TURSO_DATABASE_URL is set in the environment, Turso wins over local_path.

universe:
  # Which venues we snapshot. Binance is the primary perp universe.
  exchanges: ["binance", "hyperliquid"]
  quote_asset: "USDT"
  # CoinGecko pages of 250 => 8 pages ~= top 2000 by market cap.
  coingecko_pages: 8
  coingecko_page_pause_seconds: 3.0   # observed: 1.2s still 429s on the free tier
  # "demo" = the free Demo key (api.coingecko.com, x-cg-demo-api-key).
  # "pro"  = a paid key (pro-api.coingecko.com, x-cg-pro-api-key). D-054.
  coingecko_plan: "demo"

http:
  timeout_seconds: 20.0
  max_attempts: 5
  backoff_initial_seconds: 1.0
  backoff_max_seconds: 30.0
  user_agent: "gem-screener/0.1 (research; read-only public endpoints)"
  # Bounded concurrency for the per-symbol openInterest endpoint (the bottleneck).
  openinterest_concurrency: 10

endpoints:
  # BOTH Binance hosts are the WEBSITE host, not the API hosts (D-070).
  # fapi.binance.com and api.binance.com answer 451 from GitHub's runners,
  # which egress from Azure US. www.binance.com serves the same REST paths
  # and answers 200 from the same IP in the same second -- which is how
  # binance_announcements below has always worked. Reverting either of these
  # to an api host breaks every Binance collector in CI and nowhere else,
  # so it looks like a passing change on a laptop. A test pins them.
  binance_futures: "https://www.binance.com"
  binance_spot: "https://www.binance.com"
  hyperliquid: "https://api.hyperliquid.xyz/info"
  coingecko: "https://api.coingecko.com/api/v3"
  coingecko_pro: "https://pro-api.coingecko.com/api/v3"
  defillama: "https://api.llama.fi"
  coinalyze: "https://api.coinalyze.net/v1"
  cryptopanic: "https://cryptopanic.com/api/developer/v2"
  lunarcrush: "https://lunarcrush.com/api4/public"
  alternative_me: "https://api.alternative.me/fng/"
  binance_announcements: "https://www.binance.com/bapi/composite/v1/public/cms/article/catalog/list/query"
  # R1. Keyless. One contract per call (a comma list returns one result).
  goplus: "https://api.gopluslabs.io/api/v1"
  # R4. Keyless public datasets host. NOT api.llama.fi/emission/*, which is 402.
  defillama_datasets: "https://defillama-datasets.llama.fi"

rate_limits:
  # requests per minute
  binance_futures: 1200
  binance_spot: 1000
  hyperliquid: 600
  coingecko: 10          # observed 429 at 25/min on 2026-09-09; free tier is far tighter
  defillama: 200
  coinalyze: 40          # documented hard cap
  cryptopanic: 60
  lunarcrush: 60
  goplus: 25             # spaced, see rate_limit_spacing. Documented 30/min, but the keyless ceiling
                         # is lower; a refused call costs nothing but its slot (2026-09-14 probes)
  blockscout: 120        # TUNE_ME: public instances, no key
  defillama_datasets: 60
  # Pulse (D-078). Binance meters these two paths on their own per-IP limits,
  # not the 2,400-weight minute: /futures/data/* allows 1,000 requests per 5
  # minutes, /fapi/v1/fundingRate 500 per 5 minutes (shared with fundingInfo).
  # Set at 90% of the 5-minute ceiling spread over its five minutes, so no
  # sustained pace can exceed it; ~160 funding calls take about a minute.
  binance_futures_data: 180
  binance_funding: 90

# Sources paced one call every 60/rate seconds instead of bursting the minute's
# budget up front. GoPlus answers a burst with code 4029 (2026-09-14 probe).
rate_limit_spacing:
  - goplus

logging:
  level: "INFO"
  json_file: "logs/gem-screener.jsonl"
  console_human_readable: true

reporting:
  output_dir: "reports"
  public_json_dir: "data/public"
  history_window_days: 90

# ------------------------------------------------------------------------------
# HOLDERS (R1). Which contract to read is resolved in asset_contract; this block
# governs how the read is paced and what counts as concentration.
# ------------------------------------------------------------------------------
holders:
  # Every measurable token, every run -- never capped (D-042). 315 tokens took
  # 26.5 min on 2026-09-14 (~12 keyless reads/min, D-044). Keep this above
  # the measurable universe; it is a safety bound, not a rotation.
  max_tokens_per_run: 400
  # Block-explorer name lookups for contract holders. Cached forever after.
  max_name_lookups_per_run: 1500
  # GoPlus rate limiting arrives as HTTP 200 with code 4029 in the body, which an
  # HTTP-status retry never sees. Retries, and the first wait (doubling each time).
  # Short and many: a long wait was most of the run time (48 waits of 15-60s),
  # and GoPlus does not penalise a refused call. 3+6+..+96 = 189s worst case.
  goplus_rate_limit_retries: 6
  goplus_rate_limit_backoff_seconds: 3
  # Chains CoinGecko lists without an EVM chain id, that GoPlus still serves.
  non_evm_goplus_ids:
    solana: "solana"
    tron: "tron"
  # Verified live 2026-09-13 (optimism, scroll and gnosis answer via redirect).
  blockscout_hosts:
    ethereum: "eth.blockscout.com"
    base: "base.blockscout.com"
    arbitrum-one: "arbitrum.blockscout.com"
    polygon-pos: "polygon.blockscout.com"
    zksync: "zksync.blockscout.com"
    optimistic-ethereum: "optimism.blockscout.com"
    scroll: "scroll.blockscout.com"
    xdai: "gnosis.blockscout.com"
  # Matched against the contract's implementation name, then its own name.
  # A match means the balance is not one party's to sell: user deposits in a
  # pool or lending market, tokens escrowed or staked by many holders, bridged
  # supply, or locked vesting. A multisig (Safe) and a treasury or reserve are
  # deliberately NOT here -- those ARE one party, and are the RAVE pattern.
  exclude_contract_name_patterns:
    - "votingescrow"
    - "escrow"
    - "stake"
    - "vesting"
    - "vester"
    - "timelock"
    - "locker"
    - "tokenlock"
    - "bridge"
    - "gateway"
    - "portal"
    - "predicate"
    - "pair"
    - "pool"
    - "vault"
    - "router"
    - "atoken"
    - "ctoken"
    - "comet"
    - "distributor"
    - "gauge"
    - "masterchef"
  excluded_addresses_file: "config/excluded_addresses.yaml"

# ------------------------------------------------------------------------------
# SUPPLY HISTORY (D-072). Circulating supply per day, for net issuance in the L2
# supply block. Each asset is backfilled from CoinGecko /market_chart ONCE, then
# extended every day from market_snapshot for free. Runs in the supply job, after
# asset_contracts, so the two never compete for CoinGecko's rate limit.
# ------------------------------------------------------------------------------
supply_history:
  # One call per asset. At rate_limits.coingecko (10/min) this is ~15 minutes;
  # the whole screened universe is covered in about four runs, survivors first.
  max_fetches_per_run: 150
  # Re-backfill after this many days, which heals gaps left by a missed daily
  # collection. ~18 calls a day across the universe in steady state.
  refresh_days: 30
  # The Demo plan serves 365 days of history; two 90-day windows need ~187.
  history_days: 365

# ------------------------------------------------------------------------------
# Pulse market data (D-078): 1H klines, 1H open interest and settled funding for
# Layer 1 survivors, fetched every hour inside collect-hourly. Features are
# computed from the fetched window in-process; only bars and OI newer than the
# series_cursor are written: ~4 writes per asset an hour (a bar, an OI row
# and their two cursors), ~0.47M a month at ~160 survivors.
# ------------------------------------------------------------------------------
pulse:
  # 499, not 500: Binance documents limit [500, 1000] as weight 5 and [100, 500)
  # as weight 2. Measured 2026-09-19, 500 was billed 2 -- but 499 is weight 2
  # under either reading and costs one bar (D-078).
  klines_limit: 499
  oi_limit: 500
  # 1000 (the endpoint maximum, still one call) so R1's own-history percentile
  # spans ~333 days of an 8h contract and ~41 days of a 1h one; 100 covered as
  # little as 4 days.
  funding_limit: 1000
  concurrency: 8
  benchmark_asset: "BTC"

contracts:
  # CoinGecko /coins/{id} lookups confirming the origin chain of a multi-chain
  # token. 10/min on the free tier, so bounded; the rest wait for the next run.
  max_origin_lookups_per_run: 60

# ------------------------------------------------------------------------------
# UNLOCKS (R4). DefiLlama's datasets host serves the computed output of its
# emissions adapters. The adapters repo itself is no longer public (D-037).
# ------------------------------------------------------------------------------
unlocks:
  max_protocol_fetches_per_run: 400   # ~372 protocols, 0.1-2.5 MB each
  refresh_days: 7
  remap_days: 30
  history_days: 730
  category_map:
    insiders: "team"
    privateSale: "investor"
    publicSale: "community"
    airdrop: "community"
    farming: "community"
    staking: "community"
    liquidity: "community"
    ecosystem: "ecosystem"
    # Foundation and community reserves (Aptos, Ondo). Treated as ecosystem,
    # which never fails L1 -- agreed 2026-09-13, see D-037.
    noncirculating: "ecosystem"
    community: "community"
    # Seen once in the first live run (2026-09-13), with no further meaning in
    # the payload. Stored unlabelled rather than guessed.
    other: null
    Uncategorized: null
