# Sector index construction:
#   - equal-weight the daily returns of every mapped, L1-surviving member
#   - require at least this many members or the sector index is unreliable
min_members_for_index: 3
# Benchmark every sector against this asset (relative strength).
benchmark_asset: "BTC"
