# base_asset -> sector. Used to build sector return indices (L2 block, weight 15).
#
# Sector flows dominate price action over weeks/months even when an individual
# project's fundamentals are sound. Do not rank a good chart in a bleeding sector
# highly. An asset absent from this map gets sector = "unclassified", its sector
# block scores None, and the weight is renormalised over the remaining blocks.
# Never guess a mapping to avoid a null — a null is honest, a guess is not.
#
# Rows under "From CoinGecko categories" were added by scripts/propose_sectors.py
# (D-073): each asset takes the first sector whose CoinGecko categories it is a
# member of, in a fixed precedence, with every override's reason inline. An
# asset CoinGecko gives no category in this taxonomy (MASK, fan tokens, wallet
# tokens) stays unclassified rather than guessed.

