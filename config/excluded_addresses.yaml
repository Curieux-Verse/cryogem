# R5 -- addresses whose balance is NOT holder concentration.
#
# Most exclusions are decided automatically and recorded per holder in
# holder_snapshot.holders_json, with the reason:
#   * GoPlus is_locked = 1
#   * a DEX pair GoPlus lists for the token
#   * a contract whose name matches settings.holders.exclude_contract_name_patterns
#
# This file is for what those cannot see: burn addresses, and wallets that are
# not contracts but still are not one owner -- exchange hot and cold wallets
# above all. An exchange wallet holds many customers' tokens; counting it as
# one holder inflates concentration for every liquid token.
#
# EVERY entry needs a label AND a source you actually checked. An unverified
# row is a guess, and a wrong exclusion hides real concentration -- worse than
# a false alarm, because nothing downstream will question it.
#
# To find candidates: holders_json lists each top holder with is_contract,
# name and share. A non-contract wallet in the top 10 of many unrelated tokens
# is almost always an exchange. Check it on the chain's explorer first.

burn_addresses:
  - "0x0000000000000000000000000000000000000000"
  - "0x000000000000000000000000000000000000dead"

# Keyed by GoPlus chain id: "1" Ethereum, "56" BSC, "8453" Base, "solana", ...
