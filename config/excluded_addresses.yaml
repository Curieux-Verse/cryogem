# explorer (the page title of `source`). Candidates came from holders_json: the
# non-contract wallets appearing in the kept top 10 of 5+ unrelated tokens.
# Candidates with NO public tag (e.g. 0xa9d1e08c..., 0x15da7556..., 0xb0a3a2b6...
# on Ethereum) are deliberately absent -- an unlabelled wallet may be a whale.
