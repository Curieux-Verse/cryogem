[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    casestudy: regression tests with known historical answers (RAVE, TRB, VVV)
    integration: needs a database; still offline, never hits the network
filterwarnings =
    ignore::DeprecationWarning
