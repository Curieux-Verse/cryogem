# =============================================================================
# WHY: writes journal entries and backfills forward returns whose horizon has
# elapsed. The journal is the only component of this system that produces
# truth; everything else produces plausible-looking output.
#
# Append-only, enforced by database triggers. There is no code path here that
# deletes or edits an entry, and the database would refuse it anyway.
# =============================================================================
name: journal

on:
  workflow_dispatch:
    inputs:
      scheduled_for:
        description: "Intended fire slot from cron-job.org: \"HH:MM\" daily, \":MM\" hourly, or a UTC ISO instant"
        required: false
        default: ""

concurrency:
  group: journal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write entries and backfill elapsed horizons
        run: python -m src.cli journal
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - name: Record trigger lag
        if: always() && inputs.scheduled_for != ''
        run: python -m src.ops.record_lag --workflow journal --scheduled "$SCHEDULED_FOR"
        env:
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Healthcheck ping
        # The guard is in the SHELL, not in `if:`. A step's own `env:` block is
        # not in scope for that same step's `if` expression -- only workflow-
        # and job-level env is, because those are bound at workflow init and the
        # step's are not. `if: env.HC != ''` therefore compared '' against '',
        # was false on every run, and the step was skipped forever. The failure
        # is invisible from GitHub's side: the job is green and the step reads
        # "skipped", while healthchecks.io says "Last Ping: Never" and looks for
        # all the world like a wrong UUID.
        #
        # Pinging stays conditional on success(). A failed job must send NOTHING:
        # the missed ping is the whole signal, and it is the one failure mode
        # cron-job.org structurally cannot see, having already had its 204.
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_JOURNAL }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_JOURNAL is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"
