# =============================================================================
# WHY: writes journal entries and backfills forward returns whose horizon has
# elapsed. The journal is the only component of this system that produces
# truth; everything else produces plausible-looking output.
#
# Append-only, enforced by database triggers. There is no code path here that
# deletes or edits an entry, and the database would refuse it anyway.
# =============================================================================
name: journal

on:
  workflow_dispatch:
    inputs:
      scheduled_for:
        description: "Intended fire time (UTC ISO) from cron-job.org"
        required: false
        default: ""

concurrency:
  group: journal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write entries and backfill elapsed horizons
        run: python -m src.cli journal
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - name: Healthcheck ping
        if: success() && env.HC != ''
        env:
          HC: ${{ secrets.HEALTHCHECK_JOURNAL }}
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"
