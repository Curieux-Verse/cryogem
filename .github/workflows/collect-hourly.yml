# =============================================================================
# WHY: the hourly derivatives tier -- OI and funding time series.
#
# This is the data that cannot be reconstructed after the fact. Binance retains
# only ~30 days of openInterestHist and Coinalyze deletes intraday data daily.
# An hour not collected is an hour that can never be backtested.
#
# workflow_dispatch only. See collect-daily.yml for why there is no schedule.
# ~24 runs/day sits comfortably inside the Actions Terms of Service, which
# forbids using Actions as a general compute platform. The 5-minute tier does
# NOT belong here -- it goes on a host you control (scripts/run_collectors.py).
# =============================================================================
name: collect-hourly

on:
  workflow_dispatch:
    inputs:
      scheduled_for:
        description: "Intended fire slot from cron-job.org: \"HH:MM\" daily, \":MM\" hourly, or a UTC ISO instant"
        required: false
        default: ""

concurrency:
  group: collect-hourly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect hourly tier
        run: python -m src.cli collect hourly
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - name: Record trigger lag
        if: always() && inputs.scheduled_for != ''
        run: python -m src.ops.record_lag --workflow collect-hourly --scheduled "$SCHEDULED_FOR"
        env:
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Healthcheck ping
        # The guard is in the SHELL, not in `if:`. A step's own `env:` block is
        # not in scope for that same step's `if` expression -- only workflow-
        # and job-level env is, because those are bound at workflow init and the
        # step's are not. `if: env.HC != ''` therefore compared '' against '',
        # was false on every run, and the step was skipped forever. The failure
        # is invisible from GitHub's side: the job is green and the step reads
        # "skipped", while healthchecks.io says "Last Ping: Never" and looks for
        # all the world like a wrong UUID.
        #
        # Pinging stays conditional on success(). A failed job must send NOTHING:
        # the missed ping is the whole signal, and it is the one failure mode
        # cron-job.org structurally cannot see, having already had its 204.
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_HOURLY }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_HOURLY is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"
