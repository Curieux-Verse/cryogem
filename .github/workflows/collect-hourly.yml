# =============================================================================
# WHY: the hourly derivatives tier -- OI and funding time series.
#
# This is the data that cannot be reconstructed after the fact. Binance retains
# only ~30 days of openInterestHist and Coinalyze deletes intraday data daily.
# An hour not collected is an hour that can never be backtested.
#
# workflow_dispatch only. See collect-daily.yml for why there is no schedule.
# ~24 runs/day sits comfortably inside the Actions Terms of Service, which
# forbids using Actions as a general compute platform. The 5-minute tier does
# NOT belong here -- it goes on a host you control (scripts/run_collectors.py).
# =============================================================================
name: collect-hourly

on:
  workflow_dispatch:
    inputs:
      scheduled_for:
        description: "Intended fire slot from cron-job.org: \"HH:MM\" daily, \":MM\" hourly, or a UTC ISO instant"
        required: false
        default: ""

concurrency:
  group: collect-hourly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect hourly tier
        run: python -m src.cli collect hourly
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # The hourly tier includes `news` (registry.TIERS). Without the token
          # the collector ran keyless every hour and news_item stayed empty,
          # which looks like a dead source rather than a missing secret (D-067).
          CRYPTOPANIC_AUTH_TOKEN: ${{ secrets.CRYPTOPANIC_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - name: Record trigger lag
        if: always() && inputs.scheduled_for != ''
        run: python -m src.ops.record_lag --workflow collect-hourly --scheduled "$SCHEDULED_FOR"
        env:
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Healthcheck ping
        # The guard is in the SHELL, not in `if:`. A step's own `env:` block is
        # not in scope for that same step's `if` expression -- only workflow-
        # and job-level env is, because those are bound at workflow init and the
        # step's are not. `if: env.HC != ''` therefore compared '' against '',
        # was false on every run, and the step was skipped forever. The failure
        # is invisible from GitHub's side: the job is green and the step reads
        # "skipped", while healthchecks.io says "Last Ping: Never" and looks for
        # all the world like a wrong UUID.
        #
        # Pinging stays conditional on success(). A failed job must send NOTHING:
        # the missed ping is the whole signal, and it is the one failure mode
        # cron-job.org structurally cannot see, having already had its 204.
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_HOURLY }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_HOURLY is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"

  # ---------------------------------------------------------------------------
  # Pulse, the hourly clock (docs/PLAN_ACTIVE_SCREENER.md section 6; D-080/081).
  #
  # A separate JOB, not a step of `collect`, and deliberately without `needs`:
  #   * a failing hourly collector (CryptoPanic 404s every hour) fails the
  #     collect step, and a step after it would never run -- Pulse fetches its
  #     own bars, OI and funding and does not depend on that tier;
  #   * a Pulse failure must not cost the trigger-lag row or the collect ping,
  #     and continue-on-error on a step would have kept HEALTHCHECK_HOURLY green
  #     through a dead Pulse. Each job pings its own check, so each check means
  #     one thing: HOURLY = the collect tier, PULSE = an hour scored, SITE = the
  #     Pages deploy.
  # Timing-agnostic: it scores the last CLOSED hour whatever minute this fires.
  # ---------------------------------------------------------------------------
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Score the last closed hour
        run: python -m src.cli pulse run
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # State-change alerts only (D-080). Unset = skipped quietly; a
          # delivery failure never fails this step.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8

      - name: Healthcheck ping
        # Guarded in the shell, not in `if:` (D-033). Success only: the missed
        # ping is the signal that an hour went unscored.
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_PULSE }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_PULSE is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"

  # Redeploy the site with a fresh pulse.json -- WITHOUT a git commit: build-site
  # bakes pulse.json from the database inside its own build. A reusable-workflow
  # call, not a workflow_run link, so it adds no level to the daily chain (D-045).
  #
  # Runs after Pulse whether it succeeded or not (never when cancelled): after a
  # failure the bake still tells the truth -- the last hour until it is 3h old,
  # then "unavailable" -- which is better than leaving an old bundle up.
  #
  # No timeout-minutes here: GitHub rejects it on a job that `uses:` a workflow.
  # The called jobs carry their own (test_workflows exempts this job shape).
  site:
    needs: pulse
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-site.yml
    with:
      # The newest main, not this run's dispatch SHA: a dispatch queued just
      # before the daily data commit would otherwise redeploy yesterday's Gem
      # files over today's for an hour.
      checkout_ref: main
    secrets: inherit
