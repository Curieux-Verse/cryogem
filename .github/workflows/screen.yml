# =============================================================================
# WHY: runs L1 then L2 after the daily collection completes.
#
# Triggered by workflow_run rather than by cron, so it cannot run before the
# data it needs exists. The `conclusion == 'success'` guard matters: without
# it, a FAILED collection would still produce a screen, silently built on
# yesterday's prices, and a confident dashboard on stale data is the worst
# possible output of this system.
#
# The freshness assertion inside `screen` is the second line of defence and
# fails the job loudly if the newest derivatives row is over 26 hours old.
# =============================================================================
name: screen

on:
  workflow_run:
    workflows: ["collect-daily"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (default: today UTC)"
        required: false
        default: ""

concurrency:
  group: screen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  screen:
    # Never screen on the back of a failed collection.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Assert data freshness
        run: python -m src.cli doctor
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Run L1 + L2
        run: python -m src.cli screen ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - name: Healthcheck ping
        if: success() && env.HC != ''
        env:
          HC: ${{ secrets.HEALTHCHECK_SCREEN }}
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"
