# =============================================================================
# WHY: runs L1 then L2 after the daily collection completes, then sends the
# phone-sized summary to Telegram.
#
# Triggered by workflow_run rather than by cron, so it cannot run before the
# data it needs exists. collect-daily concludes only after BOTH its jobs finish
# -- market data, then holders and unlocks (D-045) -- so the screen always sees
# that morning's holder readings, or yesterday's if the supply job failed. The `conclusion == 'success'` guard matters: without
# it, a FAILED collection would still produce a screen, silently built on
# yesterday's prices, and a confident dashboard on stale data is the worst
# possible output of this system.
#
# The freshness assertion inside `screen` is the second line of defence and
# fails the job loudly if the newest derivatives row is over 26 hours old.
# =============================================================================
name: screen

on:
  workflow_run:
    workflows: ["collect-daily"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (default: today UTC)"
        required: false
        default: ""

concurrency:
  group: screen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  screen:
    # Never screen on the back of a failed collection -- and never on the back
    # of an HOURLY one (D-067). collect-daily serves both tiers, and an hourly
    # run writes derivatives only: screening it produced a full run, stamped
    # today, built on yesterday's prices, market caps and holder readings.
    # workflow_run carries no inputs, so the tier is read from the run's title,
    # which collect-daily sets as `collect-daily tier=<tier>`. Anchored with
    # endsWith: the tier is the title's trailing token, and an unanchored match
    # accepts the marker appearing anywhere inside a crafted value (D-068).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      endsWith(github.event.workflow_run.display_title, 'tier=daily'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Assert data freshness
        run: python -m src.cli doctor
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # RUN_DATE arrives as environment data rather than being interpolated
      # into the script, so a crafted input cannot append a second command.
      # The empty case stays a genuinely absent flag rather than an empty
      # --date, which the CLI would reject.
      - name: Run L1 + L2
        run: |
          if [ -n "$RUN_DATE" ]; then
            python -m src.cli screen --date "$RUN_DATE"
          else
            python -m src.cli screen
          fi
        env:
          RUN_DATE: ${{ inputs.date }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      # After the screen, so it reports today's ranking; before the ping, so the
      # ping still means "the screen succeeded" and nothing more.
      #
      # continue-on-error: the notification is the least important artefact in
      # the pipeline and must be the least able to break it. publish runs only
      # when this job concludes success, so a Telegram outage must not stop the
      # dashboard updating. A failed send still shows as a failed step on a
      # green job -- visible, not swallowed.
      #
      # Unset secrets are a notice and exit 0: Telegram is optional. The CLI
      # exits non-zero only when it IS configured and delivery failed (a wrong
      # token, or a chat the bot has never been messaged from).
      - name: Send Telegram summary
        continue-on-error: true
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is unset; skipping the summary"
            exit 0
          fi
          if [ -n "$RUN_DATE" ]; then
            python -m src.cli report --telegram --date "$RUN_DATE"
          else
            python -m src.cli report --telegram
          fi
        env:
          RUN_DATE: ${{ inputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - name: Healthcheck ping
        # The guard is in the SHELL, not in `if:`. A step's own `env:` block is
        # not in scope for that same step's `if` expression -- only workflow-
        # and job-level env is, because those are bound at workflow init and the
        # step's are not. `if: env.HC != ''` therefore compared '' against '',
        # was false on every run, and the step was skipped forever. The failure
        # is invisible from GitHub's side: the job is green and the step reads
        # "skipped", while healthchecks.io says "Last Ping: Never" and looks for
        # all the world like a wrong UUID.
        #
        # Pinging stays conditional on success(). A failed job must send NOTHING:
        # the missed ping is the whole signal, and it is the one failure mode
        # cron-job.org structurally cannot see, having already had its 204.
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_SCREEN }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_SCREEN is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"

  # The journal, in the same workflow as the screen that produced the ranking
  # (D-067).
  #
  # As a workflow of its own it needed a SECOND external trigger, timed by hand
  # to land after the screen. When the screen ran late -- a slow supply job, a
  # retried collection -- the journal found no ranking and skipped the day, and
  # a skipped day can never be written afterwards: the entry price is that
  # day's close, and the position is only honest if it was recorded before the
  # outcome was known. Chained to the screen it cannot be early.
  #
  # Not a workflow_run workflow, a JOB: collect-daily -> screen -> publish ->
  # build-site already uses GitHub's three workflow_run levels (D-045).
  #
  # continue-on-error, like the supply job in collect-daily: `publish` triggers
  # on THIS workflow's conclusion, so a journal failure would also cost the day
  # its dashboard. The missed HEALTHCHECK_JOURNAL ping is the signal, and the
  # red job is visible on a green workflow.
  #
  # journal.yml stays the manual re-run path. Keep the steps in step with it.
  journal:
    needs: screen
    continue-on-error: true
    concurrency:
      group: journal
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write entries and backfill elapsed horizons
        run: |
          if [ -n "$RUN_DATE" ]; then
            python -m src.cli journal --date "$RUN_DATE"
          else
            python -m src.cli journal
          fi
        env:
          RUN_DATE: ${{ inputs.date }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - name: Healthcheck ping
        # Guarded in the shell, not in `if:` (D-033). On success only: with
        # continue-on-error the workflow stays green, so the missed ping is how
        # a journal gap is seen.
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_JOURNAL }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_JOURNAL is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"
