# =============================================================================
# WHY: builds and deploys the dashboard to GitHub Pages.
#
# Deploying via a custom Actions workflow (rather than the default Jekyll
# pipeline) removes the 10-builds-per-hour Pages limit.
#
# The secret-scan gate before deploy is not optional. The bundle is public and
# permanently cached by anyone who fetches it.
# =============================================================================
name: build-site

on:
  # `publish` commits data/public/** using GITHUB_TOKEN, and GitHub deliberately
  # raises NO `push` event for a GITHUB_TOKEN commit -- otherwise a workflow
  # could retrigger itself forever. Without this workflow_run the daily data
  # lands in the repo and the site never rebuilds: the dashboard would sit on
  # whatever `web/**` a human last pushed, looking fine and being days stale.
  # The `push` trigger below still covers human pushes, which carry a real
  # actor's token.
  workflow_run:
    workflows: ["publish"]
    types: [completed]
  push:
    # main only. Pages serves ONE site, so a push to a feature branch used to
    # deploy that branch's dashboard over the live one (D-067).
    branches: [main]
    paths:
      - "data/public/**"
      - "web/**"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:
  # collect-hourly calls this every hour after Pulse, so the site redeploys with
  # a fresh pulse.json and NO git commit (PLAN section 6). Inside a called
  # workflow `github` is the CALLER's context: event_name is
  # 'workflow_dispatch', which the build job's guard below already admits.
  workflow_call:
    inputs:
      checkout_ref:
        description: "Ref to build; empty = the event's own ref"
        type: string
        required: false
        default: ""

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Never deploy on the back of a failed publish. `deploy` needs `build`, so
    # skipping here skips the deployment too. Only a workflow_run event carries
    # a conclusion; push, dispatch and a workflow_call (whose event_name is its
    # caller's, 'workflow_dispatch') all take the first branch.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 20, not 15: the Python setup and the pulse bake add ~1-2 minutes.
    timeout-minutes: 20
    # Bound under env: (never `${{ inputs }}` inline) to satisfy ci.yml's
    # interpolation guard. Empty except from collect-hourly, which asks for the
    # newest main; empty means the event's own ref, as before.
    env:
      CHECKOUT_REF: ${{ inputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # pulse.json is never committed (.gitignore): every build bakes it, the
      # daily one included, or a daily deploy would ship a site without it.
      # BEFORE `npm run build`, so copy-data puts it in web/dist and the secret
      # scan below covers it.
      #
      # continue-on-error: Pulse is secondary to the Gem site, and a bake
      # failure must never block the daily deploy. The bake itself already
      # writes status "unavailable" whenever the database cannot be read or
      # the newest hour is over 3h old, and exits 1 only on a real error, so
      # the page tells the truth and the red step still shows. This only
      # covers failures before Python runs (pip, setup).
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        continue-on-error: true
        run: pip install -r requirements.txt
      - name: Bake pulse.json
        continue-on-error: true
        run: python -m src.cli pulse bake
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # Match key SHAPES, not key WORDS -- the same patterns
      # src/report/publish.py applies before it writes anything.
      #
      # Spec 16.4 states the criterion as `grep -ri "api_key|secret|token"`,
      # which CANNOT pass on any React application: React ships an export
      # literally named __SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED, and
      # our own event payload has a field called magnitude_tokens. A gate that
      # always fails is a gate someone disables. See docs/DECISIONS.md D-020.
      - name: Scan the built bundle for secrets
        run: |
          if grep -rIlE 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|hc-ping\.com/[0-9a-f-]{36}|authToken=|bot[0-9]{8,}:[A-Za-z0-9_-]{30,}|(api[_-]?key|auth[_-]?token|bot_token)"?[[:space:]]*[:=][[:space:]]*"?[A-Za-z0-9_-]{16,}' web/dist/ ; then
            echo "::error::key-shaped string found in web/dist/ -- refusing to deploy"
            exit 1
          fi
          echo "bundle clean"

      - name: Report bundle size
        run: |
          size=$(du -sk web/dist | cut -f1)
          echo "bundle: ${size} KB uncompressed"
          gz=$(find web/dist -name '*.js' -exec gzip -c {} + | wc -c)
          echo "js gzipped: $((gz / 1024)) KB (budget: 500 KB)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # The END of the chain, and the only check that sees it (D-067). Every
      # other ping says a job succeeded; this one says the dashboard the reader
      # actually opens was rebuilt. collect-daily, screen and publish can all be
      # green while Pages is disabled, the deploy is rejected, or the artifact
      # never uploads -- and the site then sits on old data with nothing amiss.
      - name: Healthcheck ping
        # Guarded in the shell, not in `if:` (D-033).
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_SITE }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_SITE is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"
