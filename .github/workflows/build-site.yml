# =============================================================================
# WHY: builds and deploys the dashboard to GitHub Pages.
#
# Deploying via a custom Actions workflow (rather than the default Jekyll
# pipeline) removes the 10-builds-per-hour Pages limit.
#
# The secret-scan gate before deploy is not optional. The bundle is public and
# permanently cached by anyone who fetches it.
# =============================================================================
name: build-site

on:
  push:
    paths:
      - "data/public/**"
      - "web/**"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - name: Scan the built bundle for secrets
        run: |
          if grep -rIlE '(api[_-]?key["'"'"']?\s*[:=]|auth[_-]?token|github_pat_|hc-ping\.com/[0-9a-f-]{36})' web/dist/ ; then
            echo "::error::key-like string found in web/dist/ -- refusing to deploy"
            exit 1
          fi
          echo "bundle clean"

      - name: Report bundle size
        run: |
          size=$(du -sk web/dist | cut -f1)
          echo "bundle: ${size} KB uncompressed"
          gz=$(find web/dist -name '*.js' -exec gzip -c {} + | wc -c)
          echo "js gzipped: $((gz / 1024)) KB (budget: 500 KB)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
