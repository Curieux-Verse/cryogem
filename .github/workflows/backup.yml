# =============================================================================
# WHY: weekly database backup.
#
# Release assets on a PUBLIC repo are public, and a release asset cannot be made
# private. The dump is the whole database: every journal entry with its entry
# price, the holdout audit log, every collector reading. Published raw, it also
# hands anyone the exact ranking history before it is summarised (D-067).
#
# So the dump is encrypted with BACKUP_PASSPHRASE (gpg, AES256) before it leaves
# the runner, and published as a release asset -- releases do not expire, and a
# backup that silently ages out is not a backup.
#
# With no passphrase the run FAILS and publishes nothing. An artifact is not a
# private fallback: on a public repo any signed-in account can download a run's
# artifacts. A red weekly job saying "no passphrase, so no backup" is the honest
# state; a plaintext dump that looks like a backup is the dangerous one.
#
# Restore: gpg -d backup.sql.gz.gpg > backup.sql.gz, then
#          gunzip -c backup.sql.gz | sqlite3 restored.db  (D-065).
# =============================================================================
name: backup

on:
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Dump database
        run: python -m src.ops.backup --out backup.sql.gz
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # Guarded in the shell, not in `if:` (D-033): a step's own env is not in
      # scope for its own `if` expression.
      - name: Encrypt the dump
        id: encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            rm -f backup.sql.gz
            echo "::error::BACKUP_PASSPHRASE is unset. The dump was deleted unpublished:"
            echo "::error::on a public repo a release asset AND a build artifact are both"
            echo "::error::downloadable, and this dump is the whole database. Set the secret."
            exit 1
          fi
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --symmetric \
            --cipher-algo AES256 --passphrase-fd 0 \
            --output backup.sql.gz.gpg backup.sql.gz
          rm -f backup.sql.gz
          echo "encrypted=true" >> "$GITHUB_OUTPUT"

      - name: Publish the encrypted dump as a release asset
        if: steps.encrypt.outputs.encrypted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="backup-$(date -u +%Y-%m-%d)"
          gh release create "$tag" backup.sql.gz.gpg \
            --title "Database backup $tag" \
            --notes "Automated weekly dump, encrypted with BACKUP_PASSPHRASE (gpg AES256). Releases do not expire; artifacts do." \
            || gh release upload "$tag" backup.sql.gz.gpg --clobber

      # The encrypted file only, and only once encryption happened: a run's
      # artifacts on a public repo are downloadable by any signed-in account.
      - uses: actions/upload-artifact@v4
        if: steps.encrypt.outputs.encrypted == 'true'
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
