# =============================================================================
# WHY: weekly database backup.
#
# Release assets on a PUBLIC repo are public, and a release asset cannot be made
# private. The dump is the whole database: every journal entry with its entry
# price, the holdout audit log, every collector reading. Published raw, it also
# hands anyone the exact ranking history before it is summarised (D-067).
#
# So the dump is encrypted with BACKUP_PASSPHRASE (gpg, AES256) before it is
# published as a release asset -- releases do not expire, and a backup that
# silently ages out is not a backup. With no passphrase set there is no release:
# the run keeps a 30-day artifact and says so, loudly.
#
# Restore: gpg -d backup.sql.gz.gpg > backup.sql.gz, then
#          gunzip -c backup.sql.gz | sqlite3 restored.db  (D-065).
# =============================================================================
name: backup

on:
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Dump database
        run: python -m src.ops.backup --out backup.sql.gz
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # Guarded in the shell, not in `if:` (D-033): a step's own env is not in
      # scope for its own `if` expression.
      - name: Encrypt the dump
        id: encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::warning::BACKUP_PASSPHRASE is unset, so there is no durable backup:"
            echo "::warning::keeping a 30-day artifact only. A release asset would be public."
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --symmetric \
            --cipher-algo AES256 --passphrase-fd 0 \
            --output backup.sql.gz.gpg backup.sql.gz
          rm -f backup.sql.gz
          echo "encrypted=true" >> "$GITHUB_OUTPUT"

      - name: Publish the encrypted dump as a release asset
        if: steps.encrypt.outputs.encrypted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="backup-$(date -u +%Y-%m-%d)"
          gh release create "$tag" backup.sql.gz.gpg \
            --title "Database backup $tag" \
            --notes "Automated weekly dump, encrypted with BACKUP_PASSPHRASE (gpg AES256). Releases do not expire; artifacts do." \
            || gh release upload "$tag" backup.sql.gz.gpg --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          # Whichever of the two exists: encrypted when a passphrase was set.
          path: backup.sql.gz*
          retention-days: 30
