# =============================================================================
# WHY: weekly database backup.
#
# Uploaded as a RELEASE ASSET, not only as an artifact. Artifacts expire;
# releases do not. A backup that silently ages out is not a backup.
# =============================================================================
name: backup

on:
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Dump database
        run: python -m src.ops.backup --out backup.sql.gz
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="backup-$(date -u +%Y-%m-%d)"
          gh release create "$tag" backup.sql.gz \
            --title "Database backup $tag" \
            --notes "Automated weekly dump. Releases do not expire; artifacts do." \
            || gh release upload "$tag" backup.sql.gz --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz
          retention-days: 30
